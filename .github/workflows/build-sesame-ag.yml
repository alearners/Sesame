name: Sesame-AG 第三方构建
run-name: Sesame-AG Build
on:
  push:
    branches:
      - dev
    tags:
      - '[0-9]*-*'
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *'
env:
  CI: "true"
  JAVA_DISTRIBUTION: "temurin"
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "37"
  ANDROID_PLATFORM: "android-37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  RELEASE_DIR: "app/build/outputs/apk/release"
  STAGING_DIR: "app/build/outputs/apk/all"
  ASSET_DIR: "app/build/outputs/apk/release-assets"
  TARGET_SOURCE_BRANCH: "dev"
  UPSTREAM_REPO: "Sesame-AG/Sesame-AG"
  UPSTREAM_BRANCH: "dev"
  UPSTREAM_MAIN_BRANCH: "main"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
concurrency:
  group: sesame-build
  cancel-in-progress: false

jobs:
  sync-dev:
    name: "🔄 同步上游 dev 分支"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    outputs:
      dev_updated: ${{ steps.sync.outputs.dev_updated }}
      change_log: ${{ steps.sync.outputs.change_log }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          ref: main
      - name: 配置 Git 与上游
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git"
          git fetch upstream "${{ env.UPSTREAM_BRANCH }}" --quiet
      - name: 合并上游 dev 分支
        id: sync
        run: |
          if git rev-parse --verify --quiet "origin/${{ env.TARGET_SOURCE_BRANCH }}" >/dev/null; then
            git checkout -B "${{ env.TARGET_SOURCE_BRANCH }}" "origin/${{ env.TARGET_SOURCE_BRANCH }}"
          else
            git checkout -B "${{ env.TARGET_SOURCE_BRANCH }}" origin/main
          fi
          if git merge-base --is-ancestor "upstream/${{ env.UPSTREAM_BRANCH }}" HEAD; then
            echo "dev_updated=false" >> "$GITHUB_OUTPUT"
            echo "change_log=" >> "$GITHUB_OUTPUT"
            echo "ℹ️ dev 分支无更新"
            exit 0
          fi
          BEFORE_SHA="$(git rev-parse HEAD)"
          git merge "upstream/${{ env.UPSTREAM_BRANCH }}" --no-commit --no-ff -X theirs || true
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "❌ 合并上游产生冲突"
            echo "dev_updated=false" >> "$GITHUB_OUTPUT"
            echo "change_log=合并冲突" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf .github/workflows
          git checkout "${BEFORE_SHA}" -- .github/workflows 2>/dev/null || true
          git add -A
          git commit -m "Merge upstream/${{ env.UPSTREAM_BRANCH }} [skip ci]" || true
          AFTER_SHA="$(git rev-parse HEAD)"
          CHANGE_LOG="$(git log --oneline "${BEFORE_SHA}..${AFTER_SHA}")"
          echo "dev_updated=true" >> "$GITHUB_OUTPUT"
          {
            echo "change_log<<'CHANGE_LOG_EOF'"
            echo "${CHANGE_LOG}"
            echo "CHANGE_LOG_EOF"
          } >> "$GITHUB_OUTPUT"
          git push origin "${{ env.TARGET_SOURCE_BRANCH }}" --force-with-lease
          echo "✅ dev 分支已同步并推送"

  sync-main:
    name: "🔄 同步上游 main 分支"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          ref: main
      - name: 配置 Git 与上游
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git"
          git fetch upstream "${{ env.UPSTREAM_MAIN_BRANCH }}" --quiet
      - name: 合并上游 main 分支
        run: |
          git checkout -B main origin/main
          if git merge-base --is-ancestor "upstream/${{ env.UPSTREAM_MAIN_BRANCH }}" HEAD; then
            echo "ℹ️ main 分支无更新"
            exit 0
          fi
          BEFORE_SHA="$(git rev-parse HEAD)"
          git merge "upstream/${{ env.UPSTREAM_MAIN_BRANCH }}" --no-commit --no-ff -X theirs || true
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "⚠️ main分支合并冲突，跳过本次合并"
            exit 1
          fi
          rm -rf .github/workflows
          git checkout "${BEFORE_SHA}" -- .github/workflows 2>/dev/null || true
          git add -A
          git commit -m "Merge upstream/${{ env.UPSTREAM_MAIN_BRANCH }} [skip ci]" || true
          git push origin main --force-with-lease
          echo "✅ main 分支已同步并推送"

  build-and-release:
    name: "📦 Release Build"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: sync-dev
    permissions:
      contents: write
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        needs.sync-dev.outputs.dev_updated == 'true'
      )
    outputs:
      version: ${{ steps.get_version.outputs.display_version }}
      tag_name: ${{ steps.get_version.outputs.tag_name }}
      dev_commit: ${{ steps.upstream_info.outputs.dev_commit }}
      main_commit: ${{ steps.upstream_info.outputs.main_commit }}
    steps:
      - name: 磁盘清理，防止构建磁盘爆满
        run: |
          echo "::group::磁盘清理"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h
          echo "::endgroup::"
      - name: 判断检出ref
        id: pick-ref
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            echo "checkout_ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=${{ env.TARGET_SOURCE_BRANCH }}" >> "$GITHUB_OUTPUT"
          fi
      - name: 检出待构建代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ steps.pick-ref.outputs.checkout_ref }}
      - name: 设置时区
        run: echo "TZ=Asia/Shanghai" >> "$GITHUB_ENV"
      - name: 安装 JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          architecture: x64
      - name: 配置 Gradle Java Home
        run: echo "ORG_GRADLE_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"
      - name: 安装 Android SDK 工具
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: 安装 Android SDK 组件
        run: |
          echo "::group::安装SDK"
          sdkmanager --install "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          echo "::endgroup::"
      - name: 把build-tools加入PATH
        run: |
          echo "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}" >> "$GITHUB_PATH"
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false
          cache-cleanup: on-success
      - name: 赋予 Gradle 执行权限
        run: chmod +x gradlew

      - name: 读取动态版本号（优先上游官方Tag，取不到直接终止）
        id: get_version
        run: |
          VERSION_NAME=""
          VERSION_CODE=""

          # 第一层：从上游官方Tag解析，按 versionCode 数字降序取最新，确保准确
          UPSTREAM_LATEST_TAG=$(git ls-remote --tags "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            | grep -E 'refs/tags/[0-9]+-' \
            | grep -v '\^{}' \
            | awk -F'refs/tags/' '{print $2}' \
            | sort -t'-' -k1,1nr \
            | head -n1)

          if [[ "${UPSTREAM_LATEST_TAG}" =~ ^([0-9]+)-(.+)$ ]]; then
            VERSION_CODE="${BASH_REMATCH[1]}"
            VERSION_NAME="${BASH_REMATCH[2]}"
          fi

          # 第二层：本地 build.gradle.kts 正则兜底
          if [ -z "${VERSION_NAME}" ] || [ -z "${VERSION_CODE}" ]; then
            if [ -f "app/build.gradle.kts" ]; then
              [ -z "${VERSION_NAME}" ] && VERSION_NAME=$(grep -m1 -E 'versionName\s*=\s*["'\''][0-9a-zA-Z\._-]+["'\'']' app/build.gradle.kts | sed -E 's/.*versionName\s*=\s*["'\'']([^"'\'']+)["'\''].*/\1/' | tr -d '\r')
              [ -z "${VERSION_CODE}" ] && VERSION_CODE=$(grep -m1 -E 'versionCode\s*=\s*([0-9]+)' app/build.gradle.kts | sed -E 's/.*versionCode\s*=\s*([0-9]+).*/\1/' | tr -d '\r')
            fi
          fi

          # 第三层：app/gradle.properties 兜底
          if [ -z "${VERSION_NAME}" ]; then
            VERSION_NAME=$(grep '^appVersion=' app/gradle.properties 2>/dev/null | cut -d'=' -f2 | tr -d '[:space:]')
          fi

          # 严格校验
          if [ -z "${VERSION_NAME}" ] || [[ ! "${VERSION_NAME}" =~ ^[0-9a-zA-Z\._-]+$ ]]; then
            echo "❌ 无法解析出合法 VersionName（当前值：'${VERSION_NAME}'），终止构建"
            exit 1
          fi
          if [ -z "${VERSION_CODE}" ] || [[ ! "${VERSION_CODE}" =~ ^[0-9]+$ ]]; then
            echo "❌ 无法解析出合法 VersionCode（当前值：'${VERSION_CODE}'），终止构建"
            exit 1
          fi

          # 格式：版本名(版本号)，无V前缀
          TAG_NAME="v${VERSION_CODE}-${VERSION_NAME}"
          DISPLAY_VERSION="${VERSION_NAME}(${VERSION_CODE})"

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "display_version=${DISPLAY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "✅ 解析成功 -> 展示版本：${DISPLAY_VERSION}，Tag：${TAG_NAME}"

      - name: 执行 Release 构建
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: 准备待签名的 APK
        run: |
          rm -rf "${STAGING_DIR}" "${ASSET_DIR}"
          mkdir -p "${STAGING_DIR}"
          find "${RELEASE_DIR}" -maxdepth 1 -type f -name "*.apk" -exec cp {} "${STAGING_DIR}/" \;
          if [ -z "$(ls -A ${STAGING_DIR})" ]; then
            echo "❌ 未找到任何 APK 文件"
            exit 1
          fi
      - name: 对 APK 进行签名
        id: sign_apks
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: ${{ env.STAGING_DIR }}
          signingKey: ${{ secrets.KEYSTORE_BASE64 }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: ${{ env.ANDROID_BUILD_TOOLS }}
      - name: 规范化文件名
        run: |
          mkdir -p "${ASSET_DIR}"
          IFS=':' read -r -a files <<< "${{ steps.sign_apks.outputs.signedFiles }}"
          for file in "${files[@]}"; do
            [ -n "${file}" ] || continue
            base="$(basename "${file}")"
            abi="universal"
            for candidate in arm64-v8a armeabi-v7a x86_64 x86; do
              if [[ "${base}" == *"${candidate}"* ]]; then abi="${candidate}"; break; fi
            done
            cp "${file}" "${ASSET_DIR}/app-${abi}-release-signed.apk"
          done
          cd "${ASSET_DIR}"
          sha256sum -- *.apk > SHA256SUMS
      - name: 获取原仓库最新提交信息
        id: upstream_info
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream --quiet
          if git rev-parse --short upstream/dev >/dev/null 2>&1; then
            DEV_SHA="$(git rev-parse --short upstream/dev)"
            DEV_MSG="$(git log --oneline -1 upstream/dev | cut -d' ' -f2-)"
          else
            DEV_SHA="N/A"
            DEV_MSG="无"
          fi
          MAIN_SHA="$(git rev-parse --short upstream/main)"
          MAIN_MSG="$(git log --oneline -1 upstream/main | cut -d' ' -f2-)"
          echo "dev_commit=${DEV_SHA} - ${DEV_MSG}" >> "$GITHUB_OUTPUT"
          echo "main_commit=${MAIN_SHA} - ${MAIN_MSG}" >> "$GITHUB_OUTPUT"
      - name: 生成 Release 说明文件
        run: |
          {
            echo "## 📦 构建信息"
            echo "- 版本号：${{ steps.get_version.outputs.display_version }}"
            echo "- Tag：${{ steps.get_version.outputs.tag_name }}"
            echo "- 构建时间：$(date '+%Y-%m-%d %H:%M:%S')"
            echo "- Action运行链接：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "## 📝 原仓库最新提交"
            echo "- **dev**: ${{ steps.upstream_info.outputs.dev_commit }}"
            echo "- **main**: ${{ steps.upstream_info.outputs.main_commit }}"
            if [ "${{ needs.sync-dev.outputs.dev_updated }}" == "true" ]; then
              echo ""
              echo "## 📥 本次同步更新记录"
              printf '%s\n' "${{ needs.sync-dev.outputs.change_log }}" | while read -r line; do
                if [ -n "$line" ]; then echo "- $line"; fi
              done
            fi
            echo ""
            echo "## 📱 下载说明"
            echo "- \`universal\`: 通用版（推荐，适用所有设备）"
            echo "- \`arm64-v8a\`: 64位 ARM 设备（主流新手机）"
            echo "- \`armeabi-v7a\`: 32位 ARM 设备（旧款手机）"
            echo "- \`x86_64\` / \`x86\`: 安卓模拟器"
          } > release-body.md
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Sesame-AG ${{ steps.get_version.outputs.display_version }}
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: false
          body_path: release-body.md
          files: |
            ${{ env.ASSET_DIR }}/*.apk
            ${{ env.ASSET_DIR }}/SHA256SUMS
      - name: 清理旧版本（仅清理本脚本格式tag，保留最近3个）
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          releases="$(curl -sS -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${REPO}/releases?per_page=100" \
            | jq -r '.[] | select(.tag_name | test("^v[0-9]+-.+$")) | "\(.id) \(.tag_name)"' \
            | sort -r)"
          count="$(printf '%s\n' "${releases}" | sed '/^$/d' | wc -l)"
          delete_count=$((count - 3))
          if [ "${delete_count}" -le 0 ]; then exit 0; fi
          printf '%s\n' "${releases}" | tail -n "${delete_count}" | while read -r release_id tag_name; do
            curl -sS -f -X DELETE -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${REPO}/releases/${release_id}" || true
            curl -sS -f -X DELETE -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${REPO}/git/refs/tags/${tag_name}" || true
          done
      - name: 构建汇总输出
        run: |
          echo "# ✅ 构建完成 | Release Build - ${{ steps.get_version.outputs.display_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 版本：${{ steps.get_version.outputs.display_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag：${{ steps.get_version.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 上游dev：${{ steps.upstream_info.outputs.dev_commit }}" >> "$GITHUB_STEP_SUMMARY"

  notify-email:
    name: "📧 邮件通知构建结果"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ sync-dev, build-and-release ]
    permissions: {}
    if: always() && needs.build-and-release.result != 'skipped' && needs.build-and-release.result != 'cancelled'
    steps:
      - name: 准备邮件内容
        id: gen_email
        run: |
          if [ "${{ needs.sync-dev.outputs.change_log }}" == "合并冲突" ]; then
            SUBJECT="⚠️ Sesame-AG 上游合并冲突（警告）"
            {
              echo "⚠️ 上游dev分支合并冲突，本次不进行编译构建"
              echo "🔗 日志地址：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > email-body.txt
          elif [ "${{ needs.build-and-release.result }}" == "success" ]; then
            SUBJECT="✅ Sesame-AG 构建成功 (${{ needs.build-and-release.outputs.version }})"
            {
              echo "🎉 Sesame-AG 新版本已成功构建并发布！"
              echo ""
              echo "🔗 下载地址：${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.build-and-release.outputs.tag_name }}"
              echo ""
              echo "📦 版本信息：${{ needs.build-and-release.outputs.version }}"
              echo ""
              echo "📝 原仓库最新提交"
              echo "- dev: ${{ needs.build-and-release.outputs.dev_commit }}"
              echo "- main: ${{ needs.build-and-release.outputs.main_commit }}"
            } > email-body.txt
          else
            SUBJECT="❌ Sesame-AG 构建失败"
            {
              echo "❌ Sesame-AG 构建流程出现失败。"
              echo ""
              echo "🔗 错误日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > email-body.txt
          fi
          if [ "${{ needs.sync-dev.outputs.dev_updated }}" == "true" ]; then
            echo "" >> email-body.txt
            echo "📥 本次同步的全部提交：" >> email-body.txt
            printf '%s\n' "${{ needs.sync-dev.outputs.change_log }}" | while read -r line; do
              if [ -n "$line" ]; then echo "- $line" >> email-body.txt; fi
            done
          fi
          echo "subject=${SUBJECT}" >> "$GITHUB_OUTPUT"
      - name: 发送邮件
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.qq.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          to: ${{ secrets.EMAIL_RECEIVER }}
          from: GitHub Actions 自动构建
          subject: ${{ steps.gen_email.outputs.subject }}
          body: file://email-body.txt

  notify-failure:
    name: "⚠️ 失败摘要输出"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [ sync-dev, sync-main, build-and-release ]
    permissions: {}
    if: failure() || cancelled()
    steps:
      - name: 输出失败提示
        run: |
          echo "## ❌ 构建执行失败" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "请点击左侧失败的任务步骤，查看详细日志信息。" >> "$GITHUB_STEP_SUMMARY"
